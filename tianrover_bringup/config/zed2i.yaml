/**:
  ros__parameters:
    general:
      # SDK frame checker blocked grab on this NX; revisit after SDK upgrade.
      enable_image_validity_check: 0
      grab_resolution: 'HD720'
      grab_frame_rate: 15
      pub_frame_rate: 15.0
    depth:
      depth_mode: 'PERFORMANCE'
      depth_stabilization: 0
      point_cloud_freq: 5.0
    pos_tracking:
      pos_tracking_enabled: false
    sensors:
      # Acceleration m/s^2, angular velocity rad/s; independent of RGB exposures.
      sensors_pub_rate: 200.0
      sensors_image_sync: false
      publish_imu: true
      # Factory camera-to-IMU static TF only; odom/map TF remain disabled.
      publish_imu_tf: true
