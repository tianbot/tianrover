ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.2
    two_d_mode: true
    transform_time_offset: 0.0
    transform_timeout: 0.05
    predict_to_current_time: true
    print_diagnostics: true
    publish_tf: false
    publish_acceleration: false
    use_control: false
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom
    odom0: ekf/wheel
    # x y z roll pitch yaw vx vy vz vroll vpitch vyaw ax ay az
    # Do not count encoder-derived pose and velocity twice. Preserve measured vy.
    odom0_config: [false, false, false, false, false, false,
                   true, true, false, false, false, false, false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false
    imu0: ekf/imu
    # Firmware already supplies an attitude quaternion. Use its relative yaw,
    # not acceleration or a second correlated integration of the same gyro.
    imu0_config: [false, false, false, false, false, true,
                  false, false, false, false, false, false, false, false, false]
    imu0_queue_size: 20
    imu0_differential: false
    imu0_relative: true
    imu0_remove_gravitational_acceleration: false
